<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131a29;
      --card-border: #1e293b;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.2);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
      overflow-x: hidden;
    }

    /* Top Header Bar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 25, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-pulse-badge {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-header.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
    }

    .btn-cal {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Container */
    .container {
      padding: 14px 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ACTIVE SESSION HERO CARD */
    .hud-hero {
      background: linear-gradient(135deg, #131a29 0%, #1a253e 100%);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .hud-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .hud-status-badge {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.5s infinite;
    }

    .hud-timer {
      font-size: 0.8rem;
      font-weight: 700;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .hud-subject-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .hud-topic {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .hud-desc {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .hud-files-box {
      background: rgba(11, 15, 25, 0.85);
      border: 1px dashed #38bdf8;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .hud-files-label {
      font-size: 0.68rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .file-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #7dd3fc;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-family: monospace;
      margin-bottom: 4px;
      display: block;
      word-break: break-all;
    }

    .hud-next {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Filter Chips */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background: #1e293b;
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Date Pills Bar */
    .date-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .date-bar::-webkit-scrollbar { display: none; }

    .date-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      cursor: pointer;
      min-width: 60px;
    }

    .date-pill.active {
      background: #1e293b;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Timeline Cards */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .block-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .block-card.done {
      opacity: 0.45;
      filter: grayscale(0.6);
    }

    .block-time {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 52px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      border-right: 1px solid var(--card-border);
      padding-right: 10px;
      text-align: center;
    }

    .block-main {
      flex: 1;
    }

    .block-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .subject-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-HeatTransfer { background: #dc2626; color: #fff; }
    .sub-ControlSystems { background: #8b5cf6; color: #fff; }
    .sub-ManTech { background: #10b981; color: #fff; }
    .sub-FOTE { background: #f59e0b; color: #000; }
    .sub-MachineDesign { background: #ec4899; color: #fff; }

    .sub-Submit { background: #eab308; color: #000; font-weight: 900; }
    .sub-Class { background: #334155; color: #cbd5e1; }
    .sub-Routine { background: #1e293b; color: #94a3b8; }

      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .block-desc {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .block-files-list {
      background: rgba(11, 15, 25, 0.6);
      border-left: 2px solid #38bdf8;
      padding: 4px 8px;
      font-size: 0.72rem;
      color: #38bdf8;
      font-family: monospace;
      line-height: 1.4;
      border-radius: 0 4px 4px 0;
    }

    .block-check {
      display: flex;
      align-items: center;
      padding-left: 4px;
    }

    .chk {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Tab navigation at bottom */
    .nav-tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 40;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
    }
  </style>
</head>

    let selectedDate = "2026-11-05";
    let selectedSubject = "ALL";
    let alertsEnabled = false;
    let audioCtx = null;
    let lastAlertedId = null;

    // Chime Sound
    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      } catch (e) {}
    }

    function toggleAlerts() {
      if (!("Notification" in window)) {
        alert("Desktop/browser notifications are not supported on this browser.");
        return;
      }
      if (Notification.permission === "granted") {
        alertsEnabled = !alertsEnabled;
        updateAlertUI();
        if (alertsEnabled) {
          playChime();
          new Notification("🔔 Apex Study Alerts ACTIVE", {
            body: "Study alerts configured for Sem 5."
          });
        }
      } else {
        Notification.requestPermission().then(p => {
          if (p === "granted") {
            alertsEnabled = true;
            updateAlertUI();
            playChime();
          }
        });
      }
    }

    function updateAlertUI() {
      const btn = document.getElementById('btnNotif');
      if (alertsEnabled) {
        btn.classList.add('active');
        btn.innerHTML = '🔔 Alerts ON';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '🔔 Alerts';
      }
    }

    // Download RFC-compliant ICS directly from browser memory
    function downloadICS() {
      let ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Apex Study//Sem 5 V2//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "X-WR-CALNAME:Sem 5 Endsem Strategic Plan",
        "X-WR-TIMEZONE:Asia/Kolkata"
      ];

      fullSchedule.forEach(b => {
        if (b.type === 'SLEEP' || b.type === 'BREAK') return;
        const dtStart = b.date.replace(/-/g, '') + "T" + b.start.replace(/:/g, '') + "00";
        let endDate = b.date;
        if (b.end < b.start) {
          const parts = b.date.split('-');
          const dObj = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]) + 1);
          endDate = dObj.toISOString().slice(0, 10);
        }
        const dtEnd = endDate.replace(/-/g, '') + "T" + b.end.replace(/:/g, '') + "00";

        let shortFiles = "";
        if (b.files && b.files.length > 0) {
          const names = b.files.map(f => f.split('/').pop().replace('.pdf', ''));
          shortFiles = " [" + names.slice(0, 2).join(', ') + "]";
        }

        let summary = `[${b.subject}] ${b.topic}${shortFiles}`;
        if (b.type === 'EXAM') summary = `🚨 EXAM: ${summary}`;
        else if (b.type === 'SUBMISSION') summary = `⚡ SUBMIT: ${summary}`;

        let desc = `Subject: ${b.subject}\nTopic: ${b.topic}\nAction: ${b.description}`;
        if (b.files && b.files.length > 0) {
          desc += "\n\nFILES IN D:/Sem 5:";
          b.files.forEach(f => { desc += `\n  - D:/Sem 5/${f}`; });
        }

        ics.push("BEGIN:VEVENT");
        ics.push(`UID:${b.id}@apex.planner`);
        ics.push(`DTSTART;TZID=Asia/Kolkata:${dtStart}`);
        ics.push(`DTEND;TZID=Asia/Kolkata:${dtEnd}`);
        ics.push(`SUMMARY:${summary}`);
        ics.push(`DESCRIPTION:${desc}`);
        ics.push("STATUS:CONFIRMED");
        ics.push("BEGIN:VALARM");
        ics.push("TRIGGER:-PT5M");
        ics.push("ACTION:DISPLAY");
        ics.push(`DESCRIPTION:Next: [${b.subject}] ${b.topic}`);
        ics.push("END:VALARM");
        ics.push("BEGIN:VALARM");
        ics.push("TRIGGER:PT0M");
        ics.push("ACTION:DISPLAY");
        ics.push(`DESCRIPTION:NOW: [${b.subject}] ${b.topic}`);
        ics.push("END:VALARM");
        ics.push("END:VEVENT");
      });

      ics.push("END:VCALENDAR");
      const icsStr = ics.join("\r\n");
      const blob = new Blob([icsStr], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'endsem_study_schedule.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Date navigation
    function initDateBar() {
      const dates = [...new Set(fullSchedule.map(s => s.date))].sort();
      const container = document.getElementById('dateBar');
      container.innerHTML = '';

      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

      dates.forEach(d => {
        const pill = document.createElement('div');
        pill.className = `date-pill ${d === selectedDate ? 'active' : ''}`;
        
        const parts = d.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const dayNum = parseInt(parts[2], 10);
        const dObj = new Date(y, m, dayNum);
        const dayName = days[dObj.getDay()] || '';
        const monthDay = (months[m] || '') + ' ' + dayNum;

        pill.innerHTML = `<div>${dayName}</div><div style="font-size:0.85rem">${monthDay}</div>`;
        pill.onclick = () => {
          selectedDate = d;
          document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          renderTimeline();
        };
        container.appendChild(pill);
      });
    }

    function setSubjectFilter(subj, el) {
      selectedSubject = subj;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderTimeline();
    }

    function updateHero() {
      const now = new Date();
      const todayStr = "2026-11-05"; // Ground zero reference
      const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

      let current = null;
      let next = null;

      for (let i = 0; i < fullSchedule.length; i++) {
        const b = fullSchedule[i];
        if (b.date === todayStr) {
          if (timeStr >= b.start && timeStr < b.end) {
            current = b;
            next = fullSchedule[i + 1] || null;
            break;
          } else if (timeStr < b.start) {
            current = b;
            next = fullSchedule[i + 1] || null;
            break;
          }
        }
      }

      if (!current) {
        current = fullSchedule.find(b => b.date >= todayStr && b.type !== 'SLEEP') || fullSchedule[0];
      }

      if (current) {
        const isNow = (timeStr >= current.start && timeStr < current.end && current.date === todayStr);
        document.getElementById('heroStatus').innerText = isNow ? "ACTIVE STUDY BLOCK" : `UPCOMING: ${current.date} @ ${current.start}`;
        document.getElementById('heroTimer').innerText = `${current.start} - ${current.end}`;

        const sTag = document.getElementById('heroSubjectTag');
        sTag.innerText = current.subject;
        const cleanSub = current.subject.replace(/\s+/g, '');
        sTag.className = `hud-subject-tag sub-${cleanSub}`;

        document.getElementById('heroTopic').innerText = current.topic;
        document.getElementById('heroDesc').innerText = current.description;

        const filesBox = document.getElementById('heroFilesBox');
        const filesList = document.getElementById('heroFilesList');
        filesList.innerHTML = '';
        if (current.files && current.files.length > 0) {
          filesBox.style.display = 'block';
          current.files.forEach(f => {
            const pill = document.createElement('div');
            pill.className = 'file-pill';
            pill.innerText = '📄 ' + f;
            filesList.appendChild(pill);
          });
        } else {
          filesBox.style.display = 'none';
        }

        if (next) {
          document.getElementById('heroNext').innerText = `[${next.subject}] ${next.topic} (${next.start})`;
        } else {
          document.getElementById('heroNext').innerText = "Semester finished!";
        }

        if (alertsEnabled && current.id !== lastAlertedId && timeStr >= current.start) {
          lastAlertedId = current.id;
          playChime();
          if (Notification.permission === "granted") {
            new Notification(`⏰ [${current.subject}] ${current.topic}`, {
              body: current.files && current.files.length > 0 ? `Files: ${current.files.join(', ')}` : current.description
            });
          }
        }
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timelineList');
      container.innerHTML = '';

      let list = fullSchedule.filter(b => b.date === selectedDate);
      if (selectedSubject !== 'ALL') {
        list = list.filter(b => b.subject.toLowerCase().includes(selectedSubject.toLowerCase()) || b.type === 'EXAM');
      }

      if (list.length === 0) {
        container.innerHTML = '<div style="color:#64748b; text-align:center; padding:30px;">No sessions scheduled for this filter.</div>';
        return;
      }

      const savedDone = JSON.parse(localStorage.getItem('apex_done_v2') || '{}');

      list.forEach(b => {
        const card = document.createElement('div');
        const isDone = !!savedDone[b.id];
        card.className = `block-card ${isDone ? 'done' : ''}`;

        let badgeClass = 'sub-Routine';
        if (b.type === 'EXAM') badgeClass = 'sub-Exam';
        else if (b.type === 'SUBMISSION') badgeClass = 'sub-Submit';
        else if (b.type === 'CLASS') badgeClass = 'sub-Class';
        else {
          const cleanSub = b.subject.replace(/\s+/g, '');
          badgeClass = `sub-${cleanSub}`;
        }

        const filesHtml = (b.files && b.files.length > 0)
          ? `<div class="block-files-list">📂 ${b.files.map(f => f.split('/').pop()).join(', ')}</div>`
          : '';

        card.innerHTML = `
          <div class="block-time">
            <div>${b.start}</div>
            <div style="font-size:0.65rem; color:#64748b;">${b.end}</div>
          </div>
          <div class="block-main">
            <div class="block-top">
              <span class="subject-badge ${badgeClass}">${b.subject}</span>
              <span style="font-size:0.65rem; color:#94a3b8; font-weight:700;">${b.priority}</span>
            </div>
            <div class="block-title">${b.topic}</div>
            <div class="block-desc">${b.description}</div>
            ${filesHtml}
          </div>
          <div class="block-check">
            <input type="checkbox" class="chk" ${isDone ? 'checked' : ''} onchange="toggleDone('${b.id}', this.checked)">
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleDone(id, done) {
      const saved = JSON.parse(localStorage.getItem('apex_done_v2') || '{}');
      saved[id] = done;
      localStorage.setItem('apex_done_v2', JSON.stringify(saved));
      renderTimeline();
    }

    // Boot
    initDateBar();
    updateHero();
    renderTimeline();
    setInterval(updateHero, 30000);
  </script>
